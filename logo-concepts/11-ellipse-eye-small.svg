<!-- Concept K — Ellipse Eye, small & flat.  Iteration on Concept J:
     the pupil is smaller and a bit flatter while keeping J's
     top-lid-heavy asymmetry.
       rx 9 → 8,  ry 7 → 5.5  (≈70% of J's area, aspect 1.45 vs 1.29)
       cy stays at 15, so the upper lid still clips ~0.75 svg-units
       off the top of the pupil while the bottom no longer reaches
       the lower lid interior (floats 1.25 svg-units above it).
     Lid and satellite dot identical to G/I/J.  currentColor. -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32"
     role="img"
     aria-label="Rainmaker Software — ellipse eye, small and flat"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
    <title>Concept K — Ellipse Eye, small &amp; flat</title>
    <defs>
        <clipPath id="ellipse-eye-small-lid-clip">
            <ellipse cx="16" cy="16" rx="13" ry="6.5" />
        </clipPath>
    </defs>
    <!-- Pupil: smaller and flatter horizontal ellipse than J's.
           rx=8   (< J's 9, well inside lid corners) — tapers to a
                  point at x=8 and x=24.
           ry=5.5 (< J's 7, so flatter: aspect 1.45 vs J's 1.29).
           cy=15  (same as J) — pupil top y=9.5 still tucks 0.75 svg
                  behind the upper lid (clipped), pupil bottom y=20.5
                  now sits 1.25 svg above the lower lid interior.
         Upper lid still does the dominant hiding; the bottom lid
         becomes more of a visual "ground" than a clipper. -->
    <ellipse cx="16" cy="15" rx="8" ry="5.5"
             fill="currentColor" stroke="none"
             clip-path="url(#ellipse-eye-small-lid-clip)" />
    <!-- Lid drawn AFTER the pupil so its stroke covers the clip seam. -->
    <ellipse cx="16" cy="16" rx="13" ry="6.5" />
    <!-- Satellite point on the right — inherited from A/G/I/J. -->
    <circle cx="29" cy="16" r="1.4" fill="currentColor" stroke="none" />
</svg>
