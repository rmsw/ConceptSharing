<!-- Concept S — R with a slightly BIGGER pupil.
     Identical lid gap and raindrop as R; both radii of the pupil
     are scaled ×1.125, preserving the aspect ratio 2.00.

       PUPIL     rx=9  (R was 8),   ry=4.5 (R was 4),   cy=13.5.
                 Top edge of the math-pupil moves 9.5 → 9.0 (now
                 0.5 svg above the lid's interior crown), so the
                 upper lid clips ~1.25 svg of the crown (R was
                 ~0.75).  The pupil reads as a touch more dominant
                 and slightly more hidden under the lid at the
                 same time.  Bottom edge 17.5 → 18.0, so the sclera
                 sill below shrinks from 4.0 svg to 3.5 svg.  Area
                 ≈1.27× R.

       ORBIT     unchanged — ±18° gap, endpoints (28.37, 13.99) /
                 (28.37, 18.01).

       RAINDROP  unchanged — round-neck cubic with cusp tip at
                 (31.6, 16).
     currentColor. -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32"
     role="img"
     aria-label="Rainmaker Software — lazy eye, open orbit, round-neck razor raindrop, bigger pupil"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
    <title>Concept S — R with a bigger pupil (rx=9, ry=4.5)</title>
    <defs>
        <clipPath id="lazy-open-round-bigger-lid-clip">
            <ellipse cx="16" cy="16" rx="13" ry="6.5" />
        </clipPath>
    </defs>
    <ellipse cx="16" cy="13.5" rx="9" ry="4.5"
             fill="currentColor" stroke="none"
             clip-path="url(#lazy-open-round-bigger-lid-clip)" />
    <path d="M 28.37 13.99
             A 13 6.5 0 1 0 28.37 18.01" />
    <path d="M 27.5 14.7
             A 1.3 1.3 0 0 0 27.5 17.3
             C 28.5 17.3, 27.5 16, 31.6 16
             C 27.5 16, 28.5 14.7, 27.5 14.7 Z"
          fill="currentColor" stroke="none" />
</svg>
