<!-- Concept Z — T with a sharper pupil/lid corner (stronger).
     One more notch past Y on the corner-sharpness axis: pupil pushed to
     almond-ish aspect so the lid corners break hard.

       PUPIL     rx=8.5 (T=10), ry=6 (T=5), cy=13.5.  Aspect 1.42 (T=2.00,
                 Y=1.64).  Top edge at y=7.5 — 2 svg above the lid
                 interior crown — upper lid clips ~2.75 svg.  Bottom edge
                 at y=19.5.  Horizontal extent [7.5, 24.5] fits inside the
                 lid.  Pupil area ≈1.02× T.
       CORNER    pupil/orbit intersection at (23.51, 10.70).  Pupil
                 tangent 53.1° vs orbit tangent 19.5° → **33.6° corner**
                 (T was 20.0° — ~68% sharper, ~25% sharper than Y).

       ORBIT     unchanged — ±18° gap.
       RAINDROP  unchanged from R/S/T — smooth-neck round-necked cusp-
                 tipped razor drop.

     currentColor. -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32"
     role="img"
     aria-label="Rainmaker Software — lazy eye, sharper pupil-to-lid corners (stronger)"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
    <title>Concept Z — T with an even narrower/taller pupil (rx=8.5, ry=6) for sharper lid corners</title>
    <defs>
        <clipPath id="lazy-open-sharp-pupil-more-lid-clip">
            <ellipse cx="16" cy="16" rx="13" ry="6.5" />
        </clipPath>
    </defs>
    <ellipse cx="16" cy="13.5" rx="8.5" ry="6"
             fill="currentColor" stroke="none"
             clip-path="url(#lazy-open-sharp-pupil-more-lid-clip)" />
    <path d="M 28.37 13.99
             A 13 6.5 0 1 0 28.37 18.01" />
    <path d="M 27.5 14.7
             A 1.3 1.3 0 0 0 27.5 17.3
             C 28.5 17.3, 27.5 16, 31.6 16
             C 27.5 16, 28.5 14.7, 27.5 14.7 Z"
          fill="currentColor" stroke="none" />
</svg>
