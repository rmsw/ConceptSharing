<!-- Concept N — Asymmetric Droplet Eye, high & left.  Evolution
     of L: the droplet pupil is moved upwards and slightly to the
     left so the upper lid begins to cover it.
       shift: dx = −1,  dy = −3.25
       new centre: cx=15,  joint_y=13  (L was cx=16, joint_y=16.25)
     The asymmetric shape is preserved:
       top half    rx=7, ry=3.5  (flat crown)
       bottom half rx=7, ry=5.5  (round belly)
     Top edge moves from y=12.75 to y=9.5 → the upper lid now
     clips exactly 0.75 svg-units off the flat crown (matching J /
     K / M).  Bottom moves from y=21.75 to y=18.5 → 3.25 svg of
     sclera below.  The droplet looks up and to the right,
     "peering out from under the lid".  Pupil x-extent [8..22];
     satellite dot at cx=29 is still clear.
     Lid and satellite dot unchanged. -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32"
     role="img"
     aria-label="Rainmaker Software — asymmetric droplet eye, high and left"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
    <title>Concept N — Asymmetric Droplet Eye, high &amp; left</title>
    <defs>
        <clipPath id="asymmetric-droplet-eye-high-lid-clip">
            <ellipse cx="16" cy="16" rx="13" ry="6.5" />
        </clipPath>
    </defs>
    <!-- Droplet pupil, shifted (-1, -3.25) from Concept L.
         Joint at y=13: first arc (flat top, ry=3.5) now reaches
         y=9.5, putting 0.75 svg-units of the crown behind the
         upper lid; second arc (round bottom, ry=5.5) reaches
         y=18.5, leaving a clean gap to the lower lid. -->
    <path d="M 8 13
             A 7 3.5 0 0 1 22 13
             A 7 5.5 0 0 1 8 13 Z"
          fill="currentColor" stroke="none"
          clip-path="url(#asymmetric-droplet-eye-high-lid-clip)" />
    <!-- Lid drawn AFTER the pupil so its stroke covers the clip seam. -->
    <ellipse cx="16" cy="16" rx="13" ry="6.5" />
    <!-- Satellite point — unchanged across the family. -->
    <circle cx="29" cy="16" r="1.4" fill="currentColor" stroke="none" />
</svg>
