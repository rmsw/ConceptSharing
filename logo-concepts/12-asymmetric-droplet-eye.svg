<!-- Concept L — Asymmetric Droplet Eye.  The pupil is a droplet-
     shaped path: flatter on top (as if compressed by the upper
     eyelid) and rounder on the bottom (weight resting on the
     lower eyelid) — matching the weighted, top-heavy iris in the
     Rainmaker profile picture (spiral staircase eye in a brick
     tower).  Unlike G/I/J/K, the asymmetry lives in the pupil
     path itself rather than being imposed by lid clipping:
       top half:    half-ellipse with rx=7, ry=3.5  (flat crown)
       bottom half: half-ellipse with rx=7, ry=5.5  (round belly)
       joined along the horizontal diameter at y=16.25.
     Result: pupil extent y ∈ [12.75, 21.75] — 2.5 svg-units of
     sclera above the pupil (big dark crescent where the heavy
     upper lid sits) and a clean kiss on the lower lid.
     Clip-path kept for defensive robustness but does nothing at
     these coordinates.  Lid and satellite dot unchanged. -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32"
     role="img"
     aria-label="Rainmaker Software — asymmetric droplet eye"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
    <title>Concept L — Asymmetric Droplet Eye</title>
    <defs>
        <clipPath id="asymmetric-droplet-eye-lid-clip">
            <ellipse cx="16" cy="16" rx="13" ry="6.5" />
        </clipPath>
    </defs>
    <!-- Droplet pupil.  M 9,16.25 starts at the left of the horizontal
         diameter; the first arc sweeps the flatter TOP half (ry=3.5);
         the second arc sweeps the rounder BOTTOM half (ry=5.5) back
         to the start.  Both arcs are clockwise (sweep=1), so in SVG's
         screen-y-down space the first goes up-over-down and the second
         goes down-under-up, producing a closed drop shape. -->
    <path d="M 9 16.25
             A 7 3.5 0 0 1 23 16.25
             A 7 5.5 0 0 1 9 16.25 Z"
          fill="currentColor" stroke="none"
          clip-path="url(#asymmetric-droplet-eye-lid-clip)" />
    <!-- Lid drawn AFTER the pupil, consistent with the other ellipse-
         eye concepts. -->
    <ellipse cx="16" cy="16" rx="13" ry="6.5" />
    <!-- Satellite point — same as A/G/I/J/K. -->
    <circle cx="29" cy="16" r="1.4" fill="currentColor" stroke="none" />
</svg>
