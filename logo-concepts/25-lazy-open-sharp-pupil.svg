<!-- Concept Y — T with a sharper pupil/lid corner (mild).
     In T the pupil ellipse and the orbit ellipse happen to share aspect
     ratio 2.00, so their tangents nearly align at the intersection — the
     visible corners where the pupil meets the upper lid are a soft ~20°
     break.  Making the pupil narrower and taller (smaller aspect) steepens
     its tangent at the intersection and opens up a larger, visibly
     sharper corner angle without changing the overall lazy-eye read.

       PUPIL     rx=9 (T was 10), ry=5.5 (T was 5), cy=13.5.
                 Aspect 1.64 (T=2.00).  Top edge at y=8.0 — 1.5 svg above
                 the lid interior crown — so the upper lid clips ~2.25 svg
                 (T clipped ~1.75).  Bottom edge at y=19.0.  Horizontal
                 extent [7, 25] fits inside the lid.  Pupil area
                 ≈0.99× T (roughly the same).
       CORNER    pupil/orbit intersection at (23.86, 10.82).  Pupil
                 tangent 47.6° vs orbit tangent 20.8° → **26.9° corner**
                 (T was 20.0° — this is ~35% sharper).

       ORBIT     unchanged — ±18° gap.
       RAINDROP  unchanged from R/S/T — smooth-neck round-necked cusp-
                 tipped razor drop (bulb r=1.3 at (27.5, 16), tip at
                 (31.6, 16), cusp on axis).

     currentColor. -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32"
     role="img"
     aria-label="Rainmaker Software — lazy eye, sharper pupil-to-lid corners (mild)"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
    <title>Concept Y — T with a narrower/taller pupil (rx=9, ry=5.5) for sharper lid corners</title>
    <defs>
        <clipPath id="lazy-open-sharp-pupil-lid-clip">
            <ellipse cx="16" cy="16" rx="13" ry="6.5" />
        </clipPath>
    </defs>
    <ellipse cx="16" cy="13.5" rx="9" ry="5.5"
             fill="currentColor" stroke="none"
             clip-path="url(#lazy-open-sharp-pupil-lid-clip)" />
    <path d="M 28.37 13.99
             A 13 6.5 0 1 0 28.37 18.01" />
    <path d="M 27.5 14.7
             A 1.3 1.3 0 0 0 27.5 17.3
             C 28.5 17.3, 27.5 16, 31.6 16
             C 27.5 16, 28.5 14.7, 27.5 14.7 Z"
          fill="currentColor" stroke="none" />
</svg>
