<!-- Concept T — R with an even BIGGER pupil.
     Identical lid gap and raindrop as R / S; both radii of the
     pupil scaled ×1.25 (relative to R), aspect 2.00 preserved.

       PUPIL     rx=10 (R was 8),   ry=5 (R was 4),   cy=13.5.
                 Top edge of the math-pupil moves down to y=8.5
                 (1.0 svg above the lid interior crown): the upper
                 lid clips ~1.75 svg of the crown.  Bottom edge at
                 y=18.5.  The visible pupil is clearly larger than
                 in R while the lazy read is preserved — roughly a
                 quarter of the vertical pupil extent is hidden.
                 Area ≈1.56× R.  Horizontal extent [6, 26] still
                 fits comfortably inside the lid (at y=13.5 the lid
                 interior is x in about [4.1, 27.9]).

       ORBIT     unchanged — ±18° gap.

       RAINDROP  unchanged — round-neck cubic with cusp tip at
                 (31.6, 16).
     currentColor. -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32"
     role="img"
     aria-label="Rainmaker Software — lazy eye, open orbit, round-neck razor raindrop, biggest pupil"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
    <title>Concept T — R with an even bigger pupil (rx=10, ry=5)</title>
    <defs>
        <clipPath id="lazy-open-round-biggest-lid-clip">
            <ellipse cx="16" cy="16" rx="13" ry="6.5" />
        </clipPath>
    </defs>
    <ellipse cx="16" cy="13.5" rx="10" ry="5"
             fill="currentColor" stroke="none"
             clip-path="url(#lazy-open-round-biggest-lid-clip)" />
    <path d="M 28.37 13.99
             A 13 6.5 0 1 0 28.37 18.01" />
    <path d="M 27.5 14.7
             A 1.3 1.3 0 0 0 27.5 17.3
             C 28.5 17.3, 27.5 16, 31.6 16
             C 27.5 16, 28.5 14.7, 27.5 14.7 Z"
          fill="currentColor" stroke="none" />
</svg>
