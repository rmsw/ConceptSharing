<!-- Concept U — T with a rounder raindrop BODY.
     T's prior seam-fix only adjusted a single control point; the silhouette
     was still dominated by a 4.1-svg needle attached to a tiny 1.3-radius
     bulb, so it still read as "pin + bulb" rather than "teardrop body +
     tip".  U enlarges the bulb and rematches curvature at the shoulder so
     the needle now reads as a smooth continuation of a proper body.

       BULB      r=1.5 (T was 1.3), centered at (27, 16).  Shoulders at
                 (27, 14.5) and (27, 17.5).  At x=27 the orbit ellipse spans
                 y ≈ [12.54, 19.46] so the bulb sits inside with ≈2 svg
                 clearance each side.
       NEEDLE    tip at (31.6, 16), same as T (so the outer silhouette
                 extent is unchanged). Control point P1 at (28.2, 17.5),
                 on a horizontal line through the shoulder — tangent
                 matches the bulb's (tangent-break 0°) AND initial cubic
                 curvature 0.694 vs bulb κ=0.667 (ratio 1.04×, was 1.13×
                 in T-pre-R fix, then 1.13× in T itself — *wait, T's was
                 κ 0.867 vs 0.769, ratio 1.13; U drops that to 1.04×*).
                 Control point adjacent to the tip stays on the y=16 axis
                 at (27, 16) — cusp at the tip preserved.

       PUPIL     unchanged from T (rx=10, ry=5, cy=13.5).
       ORBIT     unchanged — ±18° gap.

     currentColor. -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32"
     role="img"
     aria-label="Rainmaker Software — lazy eye, open orbit, rounder teardrop body, T-pupil"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
    <title>Concept U — T with a rounder raindrop body (bulb r=1.5)</title>
    <defs>
        <clipPath id="lazy-open-round-body-lid-clip">
            <ellipse cx="16" cy="16" rx="13" ry="6.5" />
        </clipPath>
    </defs>
    <ellipse cx="16" cy="13.5" rx="10" ry="5"
             fill="currentColor" stroke="none"
             clip-path="url(#lazy-open-round-body-lid-clip)" />
    <path d="M 28.37 13.99
             A 13 6.5 0 1 0 28.37 18.01" />
    <path d="M 27 14.5
             A 1.5 1.5 0 0 0 27 17.5
             C 28.2 17.5, 27 16, 31.6 16
             C 27 16, 28.2 14.5, 27 14.5 Z"
          fill="currentColor" stroke="none" />
</svg>
