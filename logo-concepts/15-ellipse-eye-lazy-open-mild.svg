<!-- Concept O — Ellipse Eye, lazy + open orbit + razor raindrop (MILD).
     Evolution of M along three axes, all at their mildest setting:

       1. LAZY EYE.  Pupil is slightly flatter and moved a half-unit
          up into the lid.  ry 4.5 → 4, cy 14 → 13.5.  Top and bottom
          of the pupil both rise by 0.5: top from 9.5 → 9.5 (pinned,
          because ry shrank by 0.5 and cy shifted up by 0.5) and
          bottom from 18.5 → 17.5.  Aspect widens 1.78 → 2.00 and
          more of the pupil hides behind the upper-lid stroke — the
          eye reads a touch heavier-lidded / more recessed.

       2. OPEN ORBIT.  The lid is no longer a closed ellipse; it is
          drawn as an arc with a ±13° angular gap at its rightmost
          point.  Gap corners (on the math ellipse) at
          (16 + 13·cos13°, 16 ∓ 6.5·sin13°) ≈ (28.67, 14.54) and
          (28.67, 17.46).  The orbit literally "opens" where the
          raindrop exits.

       3. RAZOR RAINDROP.  Same bulb centre and radius as M
          (cx=28, cy=16, r=1.3) but the tip has been redrawn as a
          cusp instead of M's rounded quadratic.  Two cubic Béziers
          from each shoulder to the tip at (31.2, 16); for each
          cubic the control point adjacent to the tip is placed
          exactly on the y=16 axis at (28, 16), so both curves
          arrive at the tip with horizontal tangents in +x — a
          mathematical cusp (interior angle 0°).  Half-width at
          Δx=0.5 svg from the tip ≈ 0.04 svg; the needle is
          asymptotically sharp.  currentColor. -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32"
     role="img"
     aria-label="Rainmaker Software — ellipse eye, lazy + open orbit + razor raindrop, mild"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
    <title>Concept O — Ellipse Eye, lazy + open orbit + razor raindrop (mild)</title>
    <defs>
        <clipPath id="ellipse-eye-lazy-open-mild-lid-clip">
            <ellipse cx="16" cy="16" rx="13" ry="6.5" />
        </clipPath>
    </defs>
    <!-- Lazy pupil: flatter and lifted half-a-unit into the lid. -->
    <ellipse cx="16" cy="13.5" rx="8" ry="4"
             fill="currentColor" stroke="none"
             clip-path="url(#ellipse-eye-lazy-open-mild-lid-clip)" />
    <!-- Open orbit: lid arc with a ±13° gap at the right.
         Large-arc-flag=1, sweep-flag=0 → long way around (top-left-bottom). -->
    <path d="M 28.67 14.54
             A 13 6.5 0 1 0 28.67 17.46" />
    <!-- Razor raindrop with perfect cusp at (31.2, 16).
         M (upper shoulder) A (bulb semicircle, leftward) to lower shoulder
         C (lower cubic to tip, control adjacent to tip on-axis at (28,16))
         C (upper cubic back to shoulder, control adjacent to tip on-axis) Z -->
    <path d="M 28 14.7
             A 1.3 1.3 0 0 0 28 17.3
             C 28.5 17.3, 28 16, 31.2 16
             C 28 16, 28.5 14.7, 28 14.7 Z"
          fill="currentColor" stroke="none" />
</svg>
