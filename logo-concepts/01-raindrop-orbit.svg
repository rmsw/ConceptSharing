<!-- Concept A — Raindrop in orbit (currently live on the home page).
     A teardrop centered in a faint orbital ring with a single satellite
     point. Uses currentColor so it re-tints via CSS. -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32"
     role="img"
     aria-label="Rainmaker Software — raindrop in orbit"
     fill="none"
     stroke="currentColor"
     stroke-width="1.5"
     stroke-linecap="round"
     stroke-linejoin="round">
    <title>Concept A — Raindrop in orbit</title>
    <circle cx="16" cy="16" r="13" opacity="0.5" />
    <path d="M16 5 C 19.8 10.5, 21 14.5, 21 17 A 5 5 0 0 1 11 17 C 11 14.5, 12.2 10.5, 16 5 Z"
          fill="currentColor" stroke="none" />
    <circle cx="29" cy="16" r="1.4" fill="currentColor" stroke="none" />
</svg>
