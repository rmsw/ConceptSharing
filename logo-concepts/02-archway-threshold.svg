<!-- Concept B — Archway Threshold.
     A Romanesque arched doorway (the "door of perception") framing a
     horizon-line ellipse and a small light at the apex. The ellipse
     provides the subtle circular motif without reading as an orbit.
     All strokes use currentColor for easy theming. -->
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 32 32"
     role="img"
     aria-label="Rainmaker Software — archway threshold"
     fill="none"
     stroke="currentColor"
     stroke-width="1.6"
     stroke-linecap="round"
     stroke-linejoin="round">
    <title>Concept B — Archway Threshold</title>

    <!-- Outer arched door frame. Springs from (7, 14) and (25, 14),
         capped by a semicircle of radius 9 centered at (16, 14).
         Base sits just above the bottom so the mark has breathing room. -->
    <path d="M7 28 L7 14 A 9 9 0 0 1 25 14 L 25 28" />

    <!-- Ground line — closes the frame visually without making it look
         like a sealed box; kept slightly inset. -->
    <path d="M5 28 L 27 28" opacity="0.55" />

    <!-- Threshold / horizon ellipse inside the doorway. This is the
         "subtle ellipse" — it reads as a floor in perspective, or a
         pool, depending on the viewer. -->
    <ellipse cx="16" cy="22" rx="6" ry="1.6" opacity="0.7" />

    <!-- Distant light at the apex — the thing the doorway frames.
         Small filled dot so it holds up at 16px. -->
    <circle cx="16" cy="12.5" r="1.3" fill="currentColor" stroke="none" />
</svg>
